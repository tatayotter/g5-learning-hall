# Minimal Supabase CLI config — exists so `supabase test db` (and `supabase db diff` /
# `db push`, if ever needed) can spin up a local stack from supabase/migrations and know which
# remote project a `supabase link` refers to. Not used for anything else in this repo today
# (the app talks to the hosted project directly; there is no local-dev workflow yet).
project_id = "rsiupmbfhqtihmtahccg"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false
